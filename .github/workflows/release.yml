# Publica um release com o .app zipado + appcast.xml assinado para o
# Sparkle. Dispara quando o arquivo VERSION muda (ou manualmente pela
# aba Actions). A tag v<versão> é criada pelo próprio release.
name: Release

on:
  push:
    branches: ["**"]
    paths: ["VERSION"]
  workflow_dispatch:
    inputs:
      version:
        description: "Versão a publicar (ex.: 0.1.0)"
        required: true
        default: "0.1.0"

permissions:
  contents: write

env:
  SPARKLE_VERSION: "2.6.4"

jobs:
  release:
    # macOS 26 + Xcode 26: habilita FoundationModels (LLM local) e o
    # Liquid Glass nativo nos caminhos gated por compiler(>=6.2).
    runs-on: macos-26
    env:
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Set version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="$(tr -d ' \n' < VERSION)"
          fi
          /usr/bin/sed -i '' "s/MARKETING_VERSION: .*/MARKETING_VERSION: $VERSION/" project.yml
          # O Sparkle compara CFBundleVersion para detectar atualizações,
          # então o número de build precisa sempre crescer.
          /usr/bin/sed -i '' "s/CURRENT_PROJECT_VERSION: .*/CURRENT_PROJECT_VERSION: $GITHUB_RUN_NUMBER/" project.yml
          xcodegen generate
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build
        run: |
          xcodebuild -scheme Downside -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO \
            ENABLE_HARDENED_RUNTIME=NO \
            build

      - name: Package
        run: |
          mkdir -p dist
          ditto -c -k --keepParent \
            "build/Build/Products/Release/Downside.app" \
            "dist/Downside-$VERSION.zip"

      - name: Generate signed appcast
        if: env.SPARKLE_PRIVATE_KEY != ''
        run: |
          curl -fsSL -o sparkle.tar.xz \
            "https://github.com/sparkle-project/Sparkle/releases/download/$SPARKLE_VERSION/Sparkle-$SPARKLE_VERSION.tar.xz"
          mkdir -p sparkle-tools
          tar -xf sparkle.tar.xz -C sparkle-tools
          KEY_FILE="$(mktemp)"
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$KEY_FILE"
          ./sparkle-tools/bin/generate_appcast \
            --ed-key-file "$KEY_FILE" \
            --download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/" \
            -o dist/appcast.xml \
            dist
          rm -f "$KEY_FILE"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          files: dist/*
          generate_release_notes: true
