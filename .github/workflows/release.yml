# Publica um release com o .app zipado + appcast.xml assinado para o
# Sparkle sempre que uma tag v* é enviada. Ver README → "Atualizações".
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  SPARKLE_VERSION: "2.6.4"

jobs:
  release:
    runs-on: macos-15
    env:
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          /usr/bin/sed -i '' "s/MARKETING_VERSION: .*/MARKETING_VERSION: $VERSION/" project.yml
          xcodegen generate
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build
        run: |
          xcodebuild -scheme Downside -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO \
            ENABLE_HARDENED_RUNTIME=NO \
            build

      - name: Package
        run: |
          mkdir -p dist
          ditto -c -k --keepParent \
            "build/Build/Products/Release/Downside.app" \
            "dist/Downside-$VERSION.zip"

      - name: Generate signed appcast
        if: env.SPARKLE_PRIVATE_KEY != ''
        run: |
          curl -fsSL -o sparkle.tar.xz \
            "https://github.com/sparkle-project/Sparkle/releases/download/$SPARKLE_VERSION/Sparkle-$SPARKLE_VERSION.tar.xz"
          mkdir -p sparkle-tools
          tar -xf sparkle.tar.xz -C sparkle-tools
          KEY_FILE="$(mktemp)"
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$KEY_FILE"
          ./sparkle-tools/bin/generate_appcast \
            --ed-key-file "$KEY_FILE" \
            --download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/" \
            -o dist/appcast.xml \
            dist
          rm -f "$KEY_FILE"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
